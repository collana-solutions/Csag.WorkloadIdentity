name: NuGet Publish

on:
  release:
    types: [published]
  # Publishes an existing release again, for example after a failed push. A re-run of a release run uses the
  # workflow as it was at the release tag. A dispatch from main uses this file and checks out the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example @collana-solutions/csag-workload-identity@0.3.0
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish to nuget.org
    # Only a release of the package itself publishes, not a GitHub Release with another tag.
    if: startsWith(inputs.tag || github.event.release.tag_name, '@collana-solutions/csag-workload-identity@')
    runs-on: ubuntu-latest
    # The group is on the job, so a skipped release with another tag never enters it, and every
    # release tag has its own group, so no release can replace the pending run of another version.
    # Runs for the same tag wait for each other, and pushes use --skip-duplicate, so a second run for
    # the same version pushes nothing.
    concurrency:
      group: nuget-publish-${{ inputs.tag || github.event.release.tag_name }}
      cancel-in-progress: false
    # nuget.org's trusted publishing policy for this package names this environment, and the OIDC token
    # carries it, so only this job can obtain a push key.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # global.json pins the SDK. 8.x supplies the runtime the net8.0 test leg needs.
          global-json-file: global.json
          dotnet-version: 8.x

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # Tag format: @collana-solutions/csag-workload-identity@0.3.0
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack Csag.WorkloadIdentity --configuration Release --no-build -o ./nupkgs

      # The version comes from the .csproj, which scripts/sync-versions.mjs sets in the version PR, so this
      # fails when the tag and the project disagree. The package has to carry the release version, because
      # --skip-duplicate would skip a package that kept an older one and leave the new version unpublished.
      # The package.json files exist for changesets only, so the package may not contain one.
      - name: Verify packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANCHOR: Csag.WorkloadIdentity
        run: |
          shopt -s nullglob
          packages=(./nupkgs/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::dotnet pack produced no .nupkg in ./nupkgs"
            exit 1
          fi
          failed=0
          for package in "${packages[@]}"; do
            name=$(basename "$package")
            echo "$name"
            if [[ "$name" != *".${VERSION}.nupkg" ]]; then
              echo "::error::$name does not carry the release version ${VERSION}"
              failed=1
            fi
            if unzip -l "$package" | grep -qE '[ /]package\.json$'; then
              echo "::error::$name contains a package.json"
              failed=1
            fi
          done
          if [ ! -f "./nupkgs/${ANCHOR}.${VERSION}.nupkg" ]; then
            echo "::error::The anchor package ${ANCHOR}.${VERSION}.nupkg is missing"
            failed=1
          fi
          exit "$failed"

      # The key nuget.org returns is valid for one hour, so it is requested only once the package is built.
      # NUGET_USER is the nuget.org profile name of the member of collana-solutions who owns the policy.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # The .snupkg next to the .nupkg goes to the nuget.org symbol server with the same key.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
