name: NuGet Publish

on:
  release:
    types: [published]
  # Publishes an existing release again, for example after a failed push. A re-run of a release run uses the
  # workflow as it was at the release tag; a dispatch from main uses this file and checks out the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example @neolution-ch/csag-workload-identity@0.2.0
        required: true
        type: string

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    # nuget.org's trusted publishing policy for this package names this environment, and the OIDC token
    # carries it, so only this job can obtain a push key.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          # global.json pins the SDK; 8.x supplies the runtime the net8.0 test leg needs.
          global-json-file: global.json
          dotnet-version: 8.x

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Tag format: @neolution-ch/csag-workload-identity@0.1.0
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"

      - name: Remove changesets version-tracking stubs
        run: |
          # Remove package.json files so they don't leak into the NuGet package
          find . -name package.json -not -path "./node_modules/*" -delete

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack Csag.WorkloadIdentity --configuration Release --no-build -o ./nupkgs

      # The version comes from the .csproj, which scripts/sync-versions.mjs sets in the version PR, so this
      # fails when the tag and the project disagree.
      - name: Verify packed version matches the release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls ./nupkgs
          test -f "./nupkgs/Csag.WorkloadIdentity.${VERSION}.nupkg"

      # The key nuget.org returns is valid for one hour, so it is requested only once the package is built.
      # NUGET_USER is the nuget.org profile name of the member of collana-solutions who owns the policy.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
