name: NuGet Preview

# Publishes the package of a pull request to the public feedz.io preview feed. An application can then
# use the change before a release, and the change does not use a nuget.org version. A restore from the
# feed needs no credentials. A retention rule of the feed removes previews after 30 days, so this workflow
# does not delete old versions. Releases go to nuget.org only, through the NuGet Publish workflow.
on:
  pull_request:
    branches:
      - main
      - "release/**"
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# A newer push to the same PR replaces the build that has not finished.
concurrency:
  group: nuget-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FEED_URL: https://f.feedz.io/collana-solutions/csag-workloadidentity/nuget/index.json

jobs:
  pack:
    name: Pack preview package
    # Fork and Dependabot PRs do not get the FEEDZ_TOKEN secret.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Compute preview version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # A feature PR has the current release in package.json, so its preview is one patch above it.
          # The changesets release PR has the upcoming version, so its preview is a release candidate of
          # that version. Thus each preview sorts above the current release. In prerelease mode package.json
          # has a prerelease such as 1.0.0-rc.0, and the preview extends it to 1.0.0-rc.0.pr.42.183. That
          # sorts after this prerelease and before the next one (1.0.0-rc.1). The run number makes each
          # push a new version, because NuGet caches a package by id and version and does not download
          # the same version again.
          BASE=$(node -p "require('./Csag.WorkloadIdentity/package.json').version")
          if [[ "$BASE" == *-* ]]; then
            VERSION="${BASE}.pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            if [[ "$HEAD_REF" != changeset-release/* ]]; then
              PATCH=$((PATCH + 1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack Csag.WorkloadIdentity --configuration Release --no-restore -p:Version="$VERSION" -o ./nupkgs

      # The push runs in the publish job, which builds nothing, so no code from the build
      # runs on the runner that gets FEEDZ_TOKEN.
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-nupkgs
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          retention-days: 1
          if-no-files-found: error

  # Only this job gets FEEDZ_TOKEN. It checks nothing out and builds nothing: it downloads
  # what pack uploaded and pushes it. The runner image's .NET SDK provides dotnet nuget push.
  publish:
    name: Publish preview package
    needs: pack
    runs-on: ubuntu-latest
    # Downloading an artifact of the same run needs no GITHUB_TOKEN permission. The PR
    # comment needs pull-requests: write.
    permissions:
      pull-requests: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-nupkgs
          path: ./nupkgs

      # The .snupkg next to the .nupkg goes to the feed's symbol endpoint.
      - name: Push to feedz.io
        env:
          FEEDZ_TOKEN: ${{ secrets.FEEDZ_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing] feedz.io has no trusted publishing, so the preview push uses FEEDZ_TOKEN
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "$FEEDZ_TOKEN" \
            --source "$FEED_URL" \
            --skip-duplicate

      # One comment per PR. Each push updates the same comment.
      - name: Comment preview version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        with:
          script: |
            const marker = '<!-- nuget-preview -->';
            const { VERSION: version } = process.env;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const body = [
              marker,
              '### NuGet preview package',
              '',
              `\`${version}\` for ${sha} is on the [preview feed](${context.serverUrl}/${owner}/${repo}#preview-packages). Set \`Csag.WorkloadIdentity\` to this version:`,
              '',
              '```xml',
              `<PackageVersion Include="Csag.WorkloadIdentity" Version="${version}" />`,
              '```',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
